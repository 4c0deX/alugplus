<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="60%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64B5F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0D47A1" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#051329" flood-opacity="0.55"/>
    </filter>
    <filter id="boltShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0D47A1" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Shadow & Badge Container -->
  <g filter="url(#shadow)">
    <rect x="92" y="92" width="840" height="840" rx="220" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="26" stroke-opacity="0.92"/>
  </g>

  <!-- Ambient Light Reflection -->
  <ellipse cx="360" cy="240" rx="300" ry="160" fill="url(#glowGrad)" transform="rotate(-25 360 240)"/>

  <!-- Stylized Lightning Bolt -->
  <g filter="url(#boltShadow)">
    <path d="M 570 245 L 350 570 L 512 570 L 454 779 L 674 454 L 512 454 Z"
          fill="#FFFFFF"
          stroke="#FFFFFF"
          stroke-width="32"
          stroke-linejoin="round"
          stroke-linecap="round"/>
  </g>
</svg>
