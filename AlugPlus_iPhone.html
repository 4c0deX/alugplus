        DB.save();
        this.closeModal();
        this.renderAll();
        this.showToast(st.id === null ? 'Equipamento cadastrado!' : 'Equipamento atualizado!', 'success');

      confirmDeleteItem(itemId) {
        const item = this.getItemById(itemId);
        if (!item) return;
        const hasActive = DB.data.rentals.some(r => r.item_id === itemId && r.status === 'active');
        if (hasActive) {
          this.showToast('Não é possível excluir um equipamento com aluguel em andamento.', 'danger');
          return;
        }
        if (!confirm(`Deseja remover "${item.name}" do catálogo?`)) return;
        const hasPast = DB.data.rentals.some(r => r.item_id === itemId);
        if (hasPast) {
          item.is_active = 0;
        } else {
          DB.data.items = DB.data.items.filter(i => i.id !== itemId);
        }
        DB.save();
        this.renderAll();
      },

      // --- EXPORTAÇÃO E SALVAMENTO DO PRÓPRIO ARQUIVO HTML ATUALIZADO ---
      async downloadUpdatedHtmlFile() {
        this.closeModal();
        document.getElementById('toast-root').innerHTML = '';
        DB.save();

        const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const fileName = 'AlugPlus_iPhone.html';
        const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });

        // Se o iPhone suportar compartilhamento nativo de arquivo (Salvar em Arquivos / WhatsApp)
        try {
          if (navigator.canShare && window.File) {
            const file = new File([fullHtml], fileName, { type: 'text/html' });
            if (navigator.canShare({ files: [file] })) {
              await navigator.share({
                title: 'AlugPlus+ Atualizado',
                files: [file]
              });
              this.showToast('Arquivo salvo/compartilhado com sucesso!', 'success');
              return;
            }
          }
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1500);
        this.showToast('Arquivo AlugPlus_iPhone.html atualizado baixado!', 'success');
      },

      exportJsonBackup() {
        DB.save();
        const blob = new Blob([JSON.stringify(DB.data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `AlugPlus_Backup_${DB.todayDateKey}.json`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1500);
        this.showToast('Backup JSON exportado!', 'success');
      },

      closeModal() {
        this.openRentalDetailId = null;
        document.getElementById('modal-root').innerHTML = '';
      },

      showToast(msg, type = 'success', duration = 3200) {
        const root = document.getElementById('toast-root');
        const el = document.createElement('div');
        el.className = 'toast';
        const bg = type === 'success' ? '#2E7D32' : (type === 'warning' ? '#F57C00' : '#D32F2F');
        el.style.backgroundColor = bg;
        el.innerHTML = `<span>${this.escapeHtml(msg)}</span>`;
        root.appendChild(el);
        setTimeout(() => {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, duration);
      }
    };

    // Importador de Backup (.json ou .html anterior)
    document.getElementById('hidden-backup-picker').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const text = String(ev.target.result || '');
          let parsed = null;
          if (text.trim().startsWith('{')) {
            parsed = JSON.parse(text);
          } else {
            const match = text.match(/<script id="alugplus-embedded-db" type="application\/json">([\s\S]*?)<\/script>/);
            if (match && match[1]) parsed = JSON.parse(match[1]);
          }
          if (parsed && parsed.items) {
            DB.data = DB.migrate(parsed);
            DB.save();
            DB.applyTheme();
            App.renderAll();
            App.showToast('Backup importado e restaurado com sucesso!', 'success');
          } else {
            App.showToast('Arquivo de backup inválido.', 'danger');
          }
        } catch (err) {
          App.showToast('Erro ao ler arquivo de backup.', 'danger');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', () => App.init());
    } else {
      App.init();
    }
  </script>
</body>
</html>
