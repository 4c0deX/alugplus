      <!-- Row 3 -->
      <rect x="0" y="60" width="22" height="22" rx="6" fill="#880E4F"/><rect x="29" y="60" width="22" height="22" rx="6" fill="#4A148C"/><rect x="58" y="60" width="22" height="22" rx="6" fill="#311B92"/><rect x="87" y="60" width="22" height="22" rx="6" fill="#0D47A1"/><rect x="116" y="60" width="22" height="22" rx="6" fill="#006064"/><rect x="145" y="60" width="22" height="22" rx="6" fill="#1B5E20"/><rect x="174" y="60" width="22" height="22" rx="6" fill="#33691E"/><rect x="203" y="60" width="22" height="22" rx="6" fill="#E65100"/><rect x="232" y="60" width="22" height="22" rx="6" fill="#BF360C"/><rect x="261" y="60" width="22" height="22" rx="6" fill="#263238"/>
