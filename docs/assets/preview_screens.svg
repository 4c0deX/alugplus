    <text x="141" y="172" font-family="sans-serif" font-size="10" fill="#94A3B8">Alugados</text>
    <text x="141" y="200" font-family="sans-serif" font-size="22" font-weight="900" fill="#42A5F5">2</text>

    <rect x="242" y="152" width="102" height="64" rx="12" fill="#1E293B"/>
    <text x="254" y="172" font-family="sans-serif" font-size="10" fill="#94A3B8">Caixa do Dia</text>
    <text x="254" y="198" font-family="sans-serif" font-size="16" font-weight="900" fill="#64B5F6">R$ 185,00</text>

