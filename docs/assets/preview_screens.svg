    <rect x="16" y="13" width="30" height="30" rx="9" fill="url(#headerBlue)" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M 33 18 L 25 30 L 31 30 L 29 38 L 37 26 L 31 26 Z" fill="#FFFFFF"/>
    <text x="56" y="34" font-family="sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">AlugPlus+</text>
    <rect x="148" y="19" width="58" height="20" rx="10" fill="#334155"/>
    <text x="177" y="33" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Painel</text>

