    <rect x="242" y="290" width="64" height="24" rx="12" fill="#0F172A" stroke="#334155"/>
    <text x="274" y="306" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#EF5350">-10 min</text>

