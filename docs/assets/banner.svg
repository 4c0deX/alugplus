<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#0D47A1"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#42A5F5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="24" fill="url(#bgGrad)"/>

  <!-- Decorative Grid & Glow Circles -->
  <circle cx="1050" cy="70" r="220" fill="#42A5F5" opacity="0.10"/>
  <circle cx="980" cy="310" r="180" fill="#00ACC1" opacity="0.10"/>
  <path d="M 0 290 Q 400 240 800 310 T 1200 270 L 1200 360 L 0 360 Z" fill="#0F172A" opacity="0.45"/>

  <!-- Stylized Bolt Badge (Blue with White Border & White Bolt) -->
  <g transform="translate(80, 88)" filter="url(#shadow)">
    <rect x="0" y="0" width="144" height="144" rx="38" fill="url(#logoGrad)" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M 82 26 L 44 82 L 72 82 L 62 118 L 100 62 L 72 62 Z" fill="#FFFFFF"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="260" y="142" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">
    AlugPlus<tspan fill="#90CAF9">+</tspan>
  </text>

  <text x="262" y="184" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#E2E8F0">
    Gestão Offline-First de Locação de Bicicletas, Carrinhos e Equipamentos
  </text>

  <!-- Feature Pills -->
  <g transform="translate(262, 212)">
    <rect x="0" y="0" width="165" height="38" rx="19" fill="#1E293B" fill-opacity="0.85" stroke="#42A5F5" stroke-width="1.5"/>
    <text x="82.5" y="24" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">⚡ Tempo Real (1s)</text>

    <rect x="180" y="0" width="185" height="38" rx="19" fill="#1E293B" fill-opacity="0.85" stroke="#42A5F5" stroke-width="1.5"/>
    <text x="272.5" y="24" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">📦 SQLite Offline-First</text>

    <rect x="380" y="0" width="195" height="38" rx="19" fill="#1E293B" fill-opacity="0.85" stroke="#42A5F5" stroke-width="1.5"/>
    <text x="477.5" y="24" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">📊 Métricas Isoladas</text>

    <rect x="590" y="0" width="245" height="38" rx="19" fill="#1E293B" fill-opacity="0.85" stroke="#42A5F5" stroke-width="1.5"/>
    <text x="712.5" y="24" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">📱💻 Android • iOS • Desktop</text>
  </g>
</svg>
